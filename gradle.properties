# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Where Gradle looks for JDKs to satisfy the Java 8 toolchain.
# Leave empty to let Gradle auto-detect (JAVA_HOME, SDKMAN, jabba, jenv, asdf).
# Point it at your JDK 8 if auto-detection fails, e.g.
#   org.gradle.java.installations.paths=C:/path/to/jdk8
org.gradle.java.installations.paths=

